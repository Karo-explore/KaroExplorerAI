<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaroExplorerAI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#060b1b;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
text-align:center;
width:90%;
max-width:650px;
}

h1{
font-size:50px;
margin-bottom:10px;
}

p{
color:#9ca3af;
margin-bottom:30px;
}

.search-box{
display:flex;
justify-content:center;
gap:10px;
}

input{
flex:1;
padding:15px;
font-size:18px;
border:none;
border-radius:10px;
outline:none;
}

button{
padding:15px 25px;
border:none;
border-radius:10px;
background:#0ea5e9;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0284c7;
}

#result{
margin-top:35px;
font-size:22px;
color:#22c55e;
font-weight:bold;
}

.footer{
margin-top:70px;
font-size:13px;
color:#666;
}
</style>

</head>

<body>

<div class="container">

<h1>KaroExplorerAI</h1>

<p>Explore hidden patterns inside the digits of π</p>

<div class="search-box">
<input id="word" placeholder="Enter a word...">
<button onclick="search()">Search</button>
</div>

<div id="result"></div>

<div class="footer">
Powered by KaroExplorerAI • Version 2
</div>

</div>

<script>

function search(){

let word=document.getElementById("word").value.trim();

if(word==""){
document.getElementById("result").innerHTML="Please enter a word.";
return;
}

const pi =
"31415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679";

if(pi.includes(word)){
    let position = pi.indexOf(word);

    document.getElementById("result").innerHTML =
    "✅ Found!<br><br>Position: " + position;
}
else{
    else{
    else{
    document.getElementById("result").innerHTML =
    "❌ Not Found";
}

}
</script>

</body>
</html>
